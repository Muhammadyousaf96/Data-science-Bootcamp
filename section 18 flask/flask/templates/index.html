<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #4facfe, #00f2fe);
        }

        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            color: #4facfe;
        }

        nav a {
            margin-left: 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav a:hover {
            color: #4facfe;
        }

        .container {
            text-align: center;
            padding: 100px 20px;
            color: white;
        }

        .container h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .container p {
            font-size: 18px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background: white;
            color: #4facfe;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
        }

        .btn:hover {
            background: #333;
            color: white;
        }

        footer {
            background: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <nav>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Welcome 👋</h2>
        <p>This is a simple and beautiful HTML page.</p>
        <button class="btn">Get Started</button>
    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
