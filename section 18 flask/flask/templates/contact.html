<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - Data Science Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            background: #111827;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #38bdf8;
        }

        nav a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .container {
            text-align: center;
            padding: 60px 20px;
        }

        .container h2 {
            color: #38bdf8;
            font-size: 36px;
        }

        .container p {
            color: #cbd5e1;
            max-width: 600px;
            margin: auto;
        }

        .form-box {
            background: #1e293b;
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(56,189,248,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            color: black;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #111827;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Data Science Hub</h1>
        <nav>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/project">Projects</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Contact Us 📬</h2>
        <p>
            Have questions about Data Science, Machine Learning, or AI?  
            Send us a message and we’ll get back to you.
        </p>
    </div>

    <div class="form-box">

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>

    </div>

    <footer>
        <p>© 2026 Data Science Hub | Contact Page</p>
    </footer>

</body>
</html>
